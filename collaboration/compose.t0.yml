services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: t0_tactics
      POSTGRES_USER: t0_test
      POSTGRES_PASSWORD: t0_only_local
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - tactics_t0_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U t0_test -d t0_tactics"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  tactics_t0_pgdata:
