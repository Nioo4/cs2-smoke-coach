worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 128;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    log_format bootstrap '$request_method|$uri|$status|$body_bytes_sent|$request_time';
    access_log /dev/stdout bootstrap;
    error_log /dev/stderr warn;
    server {
        listen 8080;
        server_name _;
        location ~ ^/\.well-known/acme-challenge/[A-Za-z0-9_-]+$ {
            root /var/www/acme;
            default_type text/plain;
            autoindex off;
            disable_symlinks on;
            try_files $uri =404;
        }
        location / {
            default_type application/json;
            add_header Cache-Control no-store always;
            return 404 '{"error":{"code":"ENDPOINT_NOT_FOUND","message":"接口不存在。"}}';
        }
    }
}
