worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    log_format smokeline '$request_id|$request_method|$uri|$status|$body_bytes_sent|$request_time';
    access_log /dev/stdout smokeline;
    error_log /dev/stderr warn;

    limit_req_zone $binary_remote_addr zone=public_get:10m rate=120r/m;
    limit_req_zone $binary_remote_addr zone=search:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=transcription:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=admin_session:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=admin_write:10m rate=60r/m;

    upstream smokeline_backend {
        server backend:8000;
    }

    upstream smokeline_static_media {
        server unix:/tmp/smokeline-media.sock;
    }

    # Private same-process static listener.  It decides the final Range status
    # before the public proxy adds successful-media cache headers.
    server {
        listen unix:/tmp/smokeline-media.sock;
        server_name _;
        access_log off;

        location /media/ {
            alias /data/media-store/public/;
            autoindex off;
            disable_symlinks on;
            try_files $uri =404;
        }

        location ~ (?:^|/)(?:\.|(?:archive|trash)(?:/|$)) {
            return 404;
        }

        location / {
            return 404;
        }
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        autoindex off;
        client_max_body_size 1m;
        limit_req_status 429;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        error_page 413 = @request_too_large;
        error_page 429 = @rate_limited;
        error_page 502 = @upstream_bad_gateway;
        error_page 503 = @upstream_unavailable;
        error_page 504 = @upstream_timeout;

        location = /api/v1/healthz {
            proxy_pass http://smokeline_backend;
            proxy_intercept_errors off;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
        }

        location = /api/v1/readyz {
            proxy_pass http://smokeline_backend;
            proxy_intercept_errors off;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
        }

        location = /api/v1/search {
            limit_req zone=search burst=6 nodelay;
            client_max_body_size 16k;
            proxy_connect_timeout 1500ms;
            proxy_read_timeout 15s;
            proxy_pass http://smokeline_backend;
            proxy_intercept_errors off;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
        }

        location = /api/v1/transcriptions {
            limit_req zone=transcription burst=2 nodelay;
            client_max_body_size 6m;
            client_body_buffer_size 6m;
            client_body_timeout 30s;
            proxy_connect_timeout 1500ms;
            proxy_read_timeout 30s;
            proxy_pass http://smokeline_backend;
            proxy_intercept_errors off;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
        }

        location = /api/v1/admin/session {
            limit_req zone=admin_session burst=2 nodelay;
            client_max_body_size 1m;
            proxy_connect_timeout 1500ms;
            proxy_read_timeout 15s;
            proxy_pass http://smokeline_backend;
            proxy_intercept_errors off;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
        }

        location ^~ /api/v1/admin/ {
            limit_req zone=admin_write burst=12 nodelay;
            client_max_body_size 1m;
            proxy_connect_timeout 1500ms;
            proxy_read_timeout 15s;
            proxy_pass http://smokeline_backend;
            proxy_intercept_errors off;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;

            # Only the actual upload path needs the larger streaming body.
            location ~ ^/api/v1/admin/lineups/[^/]+/video$ {
                client_max_body_size 51m;
                client_body_timeout 130s;
                proxy_read_timeout 130s;
                proxy_send_timeout 130s;
                proxy_request_buffering off;
                proxy_http_version 1.1;
                proxy_pass http://smokeline_backend;
            }
        }

        location ^~ /api/v1/ {
            limit_req zone=public_get burst=24 nodelay;
            client_max_body_size 1m;
            proxy_connect_timeout 1500ms;
            proxy_read_timeout 15s;
            proxy_pass http://smokeline_backend;
            proxy_intercept_errors off;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
        }

        location /media/ {
            proxy_pass http://smokeline_static_media;
            proxy_intercept_errors off;
            proxy_buffering off;
            proxy_connect_timeout 1500ms;
            proxy_read_timeout 15s;
            add_header Cache-Control 'public, max-age=31536000, immutable';
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
        }

        location ~ (?:^|/)(?:\.|(?:archive|trash)(?:/|$)) {
            return 404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location @request_too_large {
            default_type application/json;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            add_header Cache-Control no-store always;
            add_header X-Request-ID $request_id always;
            return 413 '{"error":{"code":"REQUEST_TOO_LARGE","message":"请求体过大。","request_id":"$request_id"}}';
        }

        location @rate_limited {
            default_type application/json;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            add_header Cache-Control no-store always;
            add_header X-Request-ID $request_id always;
            return 429 '{"error":{"code":"RATE_LIMITED","message":"请求过于频繁，请稍后再试。","request_id":"$request_id"}}';
        }

        location @upstream_bad_gateway {
            default_type application/json;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            add_header Cache-Control no-store always;
            add_header X-Request-ID $request_id always;
            return 502 '{"error":{"code":"UPSTREAM_BAD_GATEWAY","message":"上游服务暂时异常。","request_id":"$request_id"}}';
        }

        location @upstream_unavailable {
            default_type application/json;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            add_header Cache-Control no-store always;
            add_header X-Request-ID $request_id always;
            return 503 '{"error":{"code":"UPSTREAM_UNAVAILABLE","message":"上游服务暂时不可用。","request_id":"$request_id"}}';
        }

        location @upstream_timeout {
            default_type application/json;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            add_header Cache-Control no-store always;
            add_header X-Request-ID $request_id always;
            return 504 '{"error":{"code":"UPSTREAM_TIMEOUT","message":"上游服务响应超时。","request_id":"$request_id"}}';
        }
    }
}
