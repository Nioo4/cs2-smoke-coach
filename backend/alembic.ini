[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
sqlalchemy.url = postgresql+psycopg://smokeline:smokeline@postgres:5432/smokeline

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = safe

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = safe

[formatter_safe]
class = app.core.logging.SafeJsonFormatter
